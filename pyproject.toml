[project]
name = "trading-agent"
version = "0.1.0"
description = "Risk-gated, paper-only Indian-market trading research foundation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "redis>=5,<7", "httpx>=0.27,<1",
]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest-asyncio>=1,<2",
]
[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.tmp/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.uv.build-backend]
source-exclude = [".uv-cache/**", ".tmp/**", ".podman/**", ".r/**"]
